<div class="min-vh-100 d-flex align-items-center justify-content-center py-4"
     style="background:#f5f5f7;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card rounded-4 border-0 shadow-sm p-4 p-md-5">

          <div class="text-center mb-4">
            <div style="font-size:48px;">🔐</div>
            <h3 class="fw-bold mt-2">Forgot Password?</h3>
            <p class="text-secondary" style="font-size:14px;">
              Enter your email and we'll send you an OTP
            </p>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size:13px;">Email Address</label>
              <input type="email" class="form-control"
                     [(ngModel)]="email" name="email"
                     placeholder="you@example.com" required />
            </div>

            <div class="alert alert-danger py-2" *ngIf="errorMsg"
                 style="font-size:13px; border-radius:10px;">
              <i class="bi bi-exclamation-circle me-1"></i>{{ errorMsg }}
            </div>

            <div class="alert alert-success py-2" *ngIf="successMsg"
                 style="font-size:13px; border-radius:10px;">
              <i class="bi bi-check-circle me-1"></i>{{ successMsg }}
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loading">
              {{ loading ? 'Sending OTP...' : 'Send OTP' }}
            </button>
          </form>

          <div class="text-center mt-3">
            <a routerLink="/login" class="text-primary" style="font-size:13px;">
              ← Back to Login
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
