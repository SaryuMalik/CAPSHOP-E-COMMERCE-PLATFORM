<div class="min-vh-100 d-flex align-items-center justify-content-center py-4"
     style="background:#f5f5f7;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <div class="card rounded-4 overflow-hidden border-0 shadow-sm">
          <div class="row g-0">

            <!-- Left -->
            <div class="col-md-5 d-none d-md-flex flex-column justify-content-center p-5"
                 style="background:#0071e3;">
              <a routerLink="/" class="text-white fw-bold mb-4 d-block" style="font-size:20px;">
                CapShop
              </a>
              <h2 class="text-white fw-bold mb-3">Welcome back!</h2>
              <p class="text-white opacity-75 mb-4">Sign in to access your orders, cart and exclusive deals.</p>
              <div class="d-flex flex-column gap-2">
                <div class="text-white opacity-75 d-flex align-items-center gap-2">
                  <i class="bi bi-check-circle-fill"></i> Track your orders
                </div>
                <div class="text-white opacity-75 d-flex align-items-center gap-2">
                  <i class="bi bi-check-circle-fill"></i> Save your cart
                </div>
                <div class="text-white opacity-75 d-flex align-items-center gap-2">
                  <i class="bi bi-check-circle-fill"></i> Exclusive deals
                </div>
              </div>
            </div>

            <!-- Right -->
            <div class="col-md-7 p-4 p-md-5">
              <h3 class="fw-bold mb-1">Sign In</h3>
              <p class="text-secondary mb-4" style="font-size:14px;">
                Don't have an account?
                <a routerLink="/register" class="text-primary fw-semibold">Register</a>
              </p>

              <form (ngSubmit)="onLogin()">
                <div class="mb-3">
                  <label class="form-label fw-semibold" style="font-size:13px;">Email Address</label>
                  <input type="email" class="form-control"
                         [(ngModel)]="email" name="email"
                         placeholder="you@example.com" required />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold" style="font-size:13px;">Password</label>
                  <input type="password" class="form-control"
                         [(ngModel)]="password" name="password"
                         placeholder="••••••••" required />
                </div>

                <div class="alert alert-danger py-2 d-flex align-items-center gap-2"
                     *ngIf="errorMsg" style="font-size:13px; border-radius:10px;">
                  <i class="bi bi-exclamation-circle"></i> {{ errorMsg }}
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2" [disabled]="loading">
                  {{ loading ? 'Signing in...' : 'Sign In' }}
                </button>
                 <div class="d-flex justify-content-end mb-3">
  <a routerLink="/forgot-password" class="text-primary" style="font-size:13px;">
    Forgot Password?
  </a>
</div>
              </form>
              
            </div>

           

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
