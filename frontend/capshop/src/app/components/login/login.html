<div class="auth-page">
  <div class="auth-container">

    <!-- Left Panel -->
    <div class="auth-left">
      <a routerLink="/" class="auth-brand">
        <div class="auth-brand-icon"><i class="bi bi-bag-heart-fill"></i></div>
        <span>CapShop</span>
      </a>
      <div class="auth-left-content">
        <h2 class="auth-left-title">Welcome back!</h2>
        <p class="auth-left-sub">Sign in to access your orders, cart and exclusive deals.</p>
        <div class="auth-features">
          <div class="auth-feature">
            <div class="auth-feature-icon"><i class="bi bi-box-seam"></i></div>
            <span>Track your orders in real-time</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon"><i class="bi bi-bag-heart"></i></div>
            <span>Save your cart across devices</span>
          </div>
          <div class="auth-feature">
            <div class="auth-feature-icon"><i class="bi bi-tag"></i></div>
            <span>Exclusive member-only deals</span>
          </div>
        </div>
      </div>
      <div class="auth-left-footer">
        Trusted by 50,000+ shoppers
      </div>
    </div>

    <!-- Right Panel -->
    <div class="auth-right">
      <div class="auth-form-wrap">
        <div class="auth-form-header">
          <h3 class="auth-form-title">Sign In</h3>
          <p class="auth-form-sub">
            Don't have an account?
            <a routerLink="/register" class="auth-link">Create one free</a>
          </p>
        </div>

        <form (ngSubmit)="onLogin()" class="auth-form">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-icon-wrap">
              <i class="bi bi-envelope input-icon"></i>
              <input type="email" class="form-control input-with-icon"
                     [(ngModel)]="email" name="email"
                     placeholder="you@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0">Password</label>
              <a routerLink="/forgot-password" class="auth-link" style="font-size:12px;">
                Forgot password?
              </a>
            </div>
            <div class="input-icon-wrap">
              <i class="bi bi-lock input-icon"></i>
              <input type="password" class="form-control input-with-icon"
                     [(ngModel)]="password" name="password"
                     placeholder="••••••••" required />
            </div>
          </div>

          <div class="alert alert-danger" *ngIf="errorMsg">
            <i class="bi bi-exclamation-circle me-2"></i>{{ errorMsg }}
          </div>

          <button type="submit" class="btn btn-primary w-100 auth-submit" [disabled]="loading">
            <span *ngIf="!loading"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
            <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-2"></span>Signing in...</span>
          </button>
        </form>

        <div class="auth-mobile-link d-md-none">
          <a routerLink="/" class="auth-link">← Back to Home</a>
        </div>
      </div>
    </div>

  </div>
</div>
