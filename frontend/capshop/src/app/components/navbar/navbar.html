<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">

    <a class="navbar-brand fw-bold" routerLink="/" style="color:#0071e3; font-size:20px;">
      CapShop
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="d-none d-lg-flex mx-4 flex-grow-1" style="max-width:360px;">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Search..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
        />
        <button class="btn btn-primary" (click)="onSearch()">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/products" routerLinkActive="active">Products</a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link px-3" routerLink="/admin" routerLinkActive="active">Admin</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">

        <button class="btn btn-sm btn-outline-secondary" (click)="toggleTheme()">
          <i class="bi" [class.bi-sun]="isDark" [class.bi-moon]="!isDark"></i>
        </button>

        <a routerLink="/cart" class="btn btn-sm btn-outline-secondary position-relative">
          <i class="bi bi-bag" style="font-size:16px;"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary"
                *ngIf="cartCount > 0">
            {{ cartCount }}
          </span>
        </a>

        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login" class="btn btn-sm btn-outline-primary">Login</a>
          <a routerLink="/register" class="btn btn-sm btn-primary">Register</a>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
              <i class="bi bi-person me-1"></i>{{ userName }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
              <li>
                <a class="dropdown-item py-2" routerLink="/orders">
                  <i class="bi bi-bag me-2 text-primary"></i>My Orders
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item py-2 text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

      </div>
    </div>
  </div>
</nav>
