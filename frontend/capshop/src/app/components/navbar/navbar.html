<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">

    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <div class="brand-icon">
        <i class="bi bi-bag-heart-fill"></i>
      </div>
      <span class="brand-text">CapShop</span>
    </a>

    <!-- Mobile actions -->
    <div class="d-flex d-lg-none align-items-center gap-2 ms-auto me-2">
      <a routerLink="/cart" class="btn btn-sm btn-ghost-icon position-relative">
        <i class="bi bi-bag" style="font-size:18px;"></i>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>
      <button class="navbar-toggler border-0 p-1" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <i class="bi bi-list" style="font-size:22px; color:var(--text-muted);"></i>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="navbarNav">

      <!-- Search (desktop) -->
      <div class="d-none d-lg-flex mx-4" style="flex:1; max-width:340px;">
        <div class="search-bar w-100">
          <i class="bi bi-search search-icon"></i>
          <input type="text" class="form-control search-input"
                 placeholder="Search products..."
                 [(ngModel)]="searchQuery"
                 (keyup.enter)="onSearch()" />
        </div>
      </div>

      <!-- Nav links -->
      <ul class="navbar-nav me-auto gap-1">
        <li class="nav-item">
          <a class="nav-link px-3 py-2" routerLink="/"
             routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 py-2" routerLink="/products" routerLinkActive="active">
            Products
          </a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link px-3 py-2" routerLink="/admin" routerLinkActive="active">
            Admin
          </a>
        </li>
      </ul>

      <!-- Right actions -->
      <div class="d-flex align-items-center gap-2">

        <!-- Theme toggle -->
        <button class="btn btn-sm btn-icon-round" (click)="toggleTheme()" [title]="isDark ? 'Light mode' : 'Dark mode'">
          <i class="bi" [class.bi-sun-fill]="isDark" [class.bi-moon-fill]="!isDark"></i>
        </button>

        <!-- Cart -->
        <a routerLink="/cart" class="btn btn-sm btn-icon-round position-relative d-none d-lg-flex">
          <i class="bi bi-bag" style="font-size:16px;"></i>
          <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
        </a>

        <!-- Guest -->
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login" class="btn btn-sm btn-outline-secondary">Login</a>
          <a routerLink="/register" class="btn btn-sm btn-primary">Sign Up</a>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="isLoggedIn">
          <div class="dropdown">
            <button class="btn btn-sm user-btn dropdown-toggle" data-bs-toggle="dropdown">
              <div class="user-avatar">{{ userName?.charAt(0)?.toUpperCase() }}</div>
              <span class="d-none d-lg-inline">{{ userName }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li class="px-3 py-2 mb-1">
                <div class="fw-semibold" style="font-size:13px;">{{ userName }}</div>
                <div class="text-muted" style="font-size:12px;">My Account</div>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" routerLink="/orders">
                  <i class="bi bi-box-seam me-2 text-primary"></i>My Orders
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                </button>
              </li>
            </ul>
          </div>
        </ng-container>

      </div>
    </div>
  </div>
</nav>
