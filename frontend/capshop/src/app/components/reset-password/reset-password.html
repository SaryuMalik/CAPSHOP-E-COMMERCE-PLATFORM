<div class="min-vh-100 d-flex align-items-center justify-content-center py-4"
     style="background:#f5f5f7;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card rounded-4 border-0 shadow-sm p-4 p-md-5">

          <div class="text-center mb-4">
            <div style="font-size:48px;">🔑</div>
            <h3 class="fw-bold mt-2">Reset Password</h3>
            <p class="text-secondary" style="font-size:14px;">
              Enter the OTP sent to <strong>{{ email }}</strong>
            </p>
          </div>

          <form (ngSubmit)="onSubmit()">

            <!-- OTP -->
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size:13px;">OTP Code</label>
              <input type="text" class="form-control text-center fw-bold"
                     [(ngModel)]="otp" name="otp"
                     placeholder="Enter 6-digit OTP"
                     maxlength="6" required
                     style="font-size:20px; letter-spacing:8px;" />
            </div>

            <!-- New Password -->
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size:13px;">New Password</label>
              <div class="input-group">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control"
                       [(ngModel)]="newPassword" name="newPassword"
                       placeholder="Min 6 characters" required />
                <button class="btn btn-outline-secondary" type="button"
                        (click)="showPassword = !showPassword">
                  <i class="bi" [class.bi-eye]="!showPassword"
                     [class.bi-eye-slash]="showPassword"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size:13px;">Confirm Password</label>
              <div class="input-group">
                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
                       [(ngModel)]="confirmPassword" name="confirmPassword"
                       placeholder="Re-enter password" required
                       [class.is-invalid]="confirmPassword && newPassword !== confirmPassword"
                       [class.is-valid]="confirmPassword && newPassword === confirmPassword" />
                <button class="btn btn-outline-secondary" type="button"
                        (click)="showConfirmPassword = !showConfirmPassword">
                  <i class="bi" [class.bi-eye]="!showConfirmPassword"
                     [class.bi-eye-slash]="showConfirmPassword"></i>
                </button>
                <div class="invalid-feedback">Passwords do not match!</div>
                <div class="valid-feedback">Passwords match ✓</div>
              </div>
            </div>

            <div class="alert alert-danger py-2" *ngIf="errorMsg"
                 style="font-size:13px; border-radius:10px;">
              <i class="bi bi-exclamation-circle me-1"></i>{{ errorMsg }}
            </div>

            <div class="alert alert-success py-2" *ngIf="successMsg"
                 style="font-size:13px; border-radius:10px;">
              <i class="bi bi-check-circle me-1"></i>{{ successMsg }}
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2"
                    [disabled]="loading || (confirmPassword && newPassword !== confirmPassword)">
              {{ loading ? 'Resetting...' : 'Reset Password' }}
            </button>

          </form>

          <div class="text-center mt-3 d-flex justify-content-between">
            <a routerLink="/forgot-password" class="text-secondary" style="font-size:13px;">
              Resend OTP
            </a>
            <a routerLink="/login" class="text-primary" style="font-size:13px;">
              Back to Login
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
